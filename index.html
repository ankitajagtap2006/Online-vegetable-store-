<!DOCTYPE html>
<html>
<head>
  <title>Online Vegetable Store</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4fff4;
    }

    header {
      background: green;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .search {
      text-align: center;
      margin: 20px;
    }

    .search input {
      padding: 12px;
      width: 80%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #aaa;
      text-align: center;
    }

    .card h2 {
      color: green;
    }

    .card img {
      width: 150px;
      height: 120px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      margin: 10px auto;
    }

    button {
      background: green;
      color: white;
      border: none;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    #cart {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #aaa;
    }

    .cart-item {
      padding: 12px;
      margin: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .customer {
      margin-top: 20px;
    }

    .customer input,
    .customer textarea {
      padding: 12px;
      width: 90%;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .order-btn {
      background: orange;
      font-size: 18px;
      padding: 12px 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>🥕 Online Vegetable Store 🥦</h1>
  <p>Fresh Vegetables at Your Doorstep</p>
</header>

<div class="search">
  <input
    type="text"
    id="searchBox"
    placeholder="🔍 Search vegetable..."
    onkeyup="searchVegetables()"
  >
</div>

<div class="container" id="vegetables">
  <p>Loading vegetables...</p>
</div>

<div id="cart">

  <h2>🛒 Shopping Cart</h2>

  <div id="cartItems">
    No items added.
  </div>

  <h3>
    Total: ₹<span id="total">0</span>
  </h3>

  <div class="customer">

    <h2>👤 Customer Details</h2>

    <input
      type="text"
      id="customerName"
      placeholder="Enter your name"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Enter mobile number"
    >

    <textarea
      id="customerAddress"
      placeholder="Enter delivery address"
      rows="4"
    ></textarea>

  </div>

  <br>

  <button class="order-btn" onclick="placeOrder()">
    🛍️ Place Order
  </button>

</div>

<script>

let cart = [];
let total = 0;

/* VEGETABLE API */

fetch("https://dummyjson.com/products/category/groceries")

.then(response => response.json())

.then(data => {

  const vegetables =
    document.getElementById("vegetables");

  vegetables.innerHTML = "";

  const vegetableNames = [
    "Cucumber",
    "Green Bell Pepper",
    "Green Chili Pepper",
    "Lemon",
    "Carrots",
    "Potatoes",
    "Tomato",
    "Onion"
  ];

  const vegetableProducts = data.products.filter(product =>
    vegetableNames.some(name =>
      product.title.toLowerCase().includes(name.toLowerCase())
    )
  );

  vegetableProducts.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h2>${product.title}</h2>

      <img
        src="${product.thumbnail}"
        alt="${product.title}"
      >

      <p>${product.description}</p>

      <p>
        <b>Price: ₹${product.price}</b>
      </p>

      <button onclick="addToCart('${product.title}', ${product.price})">
        Add to Cart
      </button>
    `;

    vegetables.appendChild(card);

  });

  if (vegetableProducts.length === 0) {
    vegetables.innerHTML =
      "<p>No vegetables found.</p>";
  }

})

.catch(error => {

  document.getElementById("vegetables").innerHTML =
    "<p>Unable to load vegetables.</p>";

});


/* ADD TO CART */

function addToCart(name, price) {

  let existingItem =
    cart.find(item => item.name === name);

  if (existingItem) {

    existingItem.quantity++;

  } else {

    cart.push({
      name: name,
      price: price,
      quantity: 1
    });

  }

  calculateTotal();
  displayCart();
}


/* PLUS */

function increaseQuantity(index) {

  cart[index].quantity++;

  calculateTotal();
  displayCart();
}


/* MINUS */

function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity--;

  } else {

    cart.splice(index, 1);

  }

  calculateTotal();
  displayCart();
}


/* REMOVE */

function removeItem(index) {

  cart.splice(index, 1);

  calculateTotal();
  displayCart();
}


/* TOTAL */

function calculateTotal() {

  total = 0;

  cart.forEach(item => {

    total += item.price * item.quantity;

  });

}


/* DISPLAY CART */

function displayCart() {

  const cartItems =
    document.getElementById("cartItems");

  if (cart.length === 0) {

    cartItems.innerHTML =
      "No items added.";

    document.getElementById("total").innerText =
      "0";

    return;
  }

  cartItems.innerHTML = "";

  cart.forEach((item, index) => {

    cartItems.innerHTML += `

      <div class="cart-item">

        <b>${item.name}</b>

        <br>

        Price: ₹${item.price}

        <br>

        Quantity:

        <button onclick="decreaseQuantity(${index})">
          −
        </button>

        <b>${item.quantity}</b>

        <button onclick="increaseQuantity(${index})">
          +
        </button>

        <button onclick="removeItem(${index})">
          🗑️ Remove
        </button>

      </div>

    `;

  });

  document.getElementById("total").innerText =
    total.toFixed(2);
}


/* SEARCH */

function searchVegetables() {

  let search =
    document.getElementById("searchBox")
    .value
    .toLowerCase();

  let cards =
    document.querySelectorAll(".card");

  cards.forEach(function(card) {

    let name =
      card.querySelector("h2")
      .innerText
      .toLowerCase();

    if (name.includes(search)) {

      card.style.display = "block";

    } else {

      card.style.display = "none";

    }

  });

}


/* PLACE ORDER */

function placeOrder() {

  if (cart.length === 0) {

    alert(
      "Please add vegetables to cart first."
    );

    return;
  }

  let name =
    document.getElementById("customerName").value;

  let phone =
    document.getElementById("customerPhone").value;

  let address =
    document.getElementById("customerAddress").value;


  if (
    name === "" ||
    phone === "" ||
    address === ""
  ) {

    alert(
      "Please fill all customer details."
    );

    return;
  }


  alert(
    "🎉 ORDER PLACED SUCCESSFULLY!\n\n" +
    "Customer: " + name + "\n" +
    "Mobile: " + phone + "\n" +
    "Total Amount: ₹" +
    total.toFixed(2)
  );

}

</script>

</body>
</html>
